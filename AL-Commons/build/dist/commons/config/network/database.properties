# ----------------------------
# Database Config's:
# ----------------------------

# This class represents database driver class that will be used while connecting to database
# MameAion Phase12: use bundled MySQL Connector/J 5 driver until Connector/J 8+ is added.
database.driver = com.mysql.cj.jdbc.Driver

# This is database url. 
database.url = jdbc:mysql://localhost:3306/aion_uni?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&tcpKeepAlive=true&connectTimeout=10000&socketTimeout=120000

# Database user
database.user = root

# Database password
# NOTE: Change this! Root password is not safe!
database.password = 


# Database pool mode: auto = prefer HikariCP when present, fallback to BoneCP.
# Use hikari to require HikariCP, or bonecp for legacy fallback.
database.pool = auto

# JDK25 / HikariCP stability settings
database.connectionpool.connections.max = 10
database.connectionpool.timeout = 10000
database.connectionpool.max_lifetime = 600000
database.connectionpool.idle_timeout = 300000
database.connectionpool.keepalive_time = 120000
database.connectionpool.validation_timeout = 5000
database.connectionpool.minimum_idle = -1
database.connectionpool.leak_detection_threshold = 0

# Legacy BoneCP fallback settings
# Number of partitions created by bonecp
database.bonecp.partition.count = 2

# Minimal amount of connections kept in bonecp partition
database.bonecp.partition.connections.min = 2

# Maximal amount of connections kept in bonecp partition
database.bonecp.partition.connections.max = 5

# Script context that will be loaded by database factory, it should implement DAO instances
database.scriptcontext.descriptor = ./data/scripts/system/database.xml