# ----------------------------
# Developer Config's:
# ----------------------------
# Enable spawns
# Default: true
# if false - not spawns will be loaded
gameserver.developer.spawn.enable = true

# Check spawns
# Default: false
# if true - checks spawns being outside any known zones
gameserver.developer.spawn.check = false

# if set, adds specified stat bonus for items with random bonuses
gameserver.developer.itemstat.id = 0

# Display random number of item bonus for devs 
# Default: false
gameserver.developer.itemstat.rnd = false

# ------------------------------
# Packets Proccessing Settings
# (By GiGatR00n v4.7.5.x)
# ------------------------------
# Display Packets Name for Developers only (Only Console Window)
# Default: false
gameserver.developer.showpackets.enable = false

# Display Packets Name or Hex-Bytes in Chat Window
# Default: false
gameserver.developer.show.packetnames.inchat.enable = false
gameserver.developer.show.packetbytes.inchat.enable = false

# Total Packet Bytes should be shown in Chat Window?
# Default: 200-Hexed bytes
gameserver.developer.show.packetbytes.inchat.total = 200

# Filters which Packets should be shown in Chat Windows?
# Default: * (All Packets Shown)
# e.g.  SM_MOVE, CM_CASTSPELL, CM_ATTACK
gameserver.developer.filter.packets.inchat = *

# if the Player Access Level is meet, display Packets-Name or Hex-Bytes in Chat Window 
# Tip: Player Access-Level higher than 3 is recommended
#
#  10 - Server-Owner
#   9 - Server-CoOwner
#   8 - Server-Admin
#   7 - Server-CoAdmin
#   6 - Developer
#	5 - Admin
#	4 - Head-GM
#	3 - Senior-GM
#	2 - Junior-GM
#	1 - Supporter
#	0 - Players
#
gameserver.developer.show.packets.inchat.accesslevel = 3
# ------------------------------
# MameAion 7.8 Protocol Trace
# ------------------------------
# Lightweight in-memory C2S/S2C ring buffer for opcode/packet migration.
# Dumps are written only on disconnect/exception/invalid packet unless full packet logs are enabled.
gameserver.developer.protocol.trace.enable = true
gameserver.developer.protocol.trace.dir = log/protocol
gameserver.developer.protocol.trace.last.packets = 200
gameserver.developer.protocol.trace.hex.bytes = 128
gameserver.developer.protocol.trace.dump.on.disconnect = true
gameserver.developer.protocol.trace.dump.on.exception = true
gameserver.developer.protocol.trace.enterworld = true

# Keep these false unless you need full continuous packet traffic logs.
gameserver.developer.protocol.trace.log.client.packets = false
gameserver.developer.protocol.trace.log.server.packets = false

# ------------------------------
# MameAion 7.8 Equipment/Combat Trace
# ------------------------------
gameserver.developer.equipment.trace.enable = true
gameserver.developer.combat.trace.enable = true

# Phase24 stat/combat/buff audit controls
gameserver.developer.equipment.trace.console = true
gameserver.developer.equipment.trace.verbose = true
gameserver.developer.combat.trace.console = true
gameserver.developer.combat.trace.player.only = true
gameserver.developer.combat.suppress.zero.damage.npc.to.player = true
gameserver.developer.buff.trace.enable = true
gameserver.developer.buff.trace.console = true
gameserver.developer.stat.audit.file.enable = true
gameserver.developer.stat.audit.dir = log/devprobe

# ------------------------------
# Phase25 Skill/Effect/NPC/Packet DevProbe
# ------------------------------
# Skill activation lifecycle trace: request/canUse/use/startCast/endCast/cancel/fail.
gameserver.developer.skill.trace.enable = true
gameserver.developer.skill.trace.console = true

# General effect trace for all effect templates, not only BuffEffect.
gameserver.developer.effect.trace.all.enable = true
gameserver.developer.effect.trace.console = false

# NPC visibility/load trace on map move/knownlist; file output is useful for delayed or missing NPC/gear rendering.
gameserver.developer.npc.visibility.trace.enable = true
gameserver.developer.npc.visibility.trace.console = false

# AI walking diagnostics and default NpcAI2 think bridge.
gameserver.developer.ai.walk.trace.enable = true
gameserver.developer.ai.walk.trace.console = false
gameserver.developer.ai.default.think.enable = true

# 7.x attack status packet compatibility. false matches the working 7.x reference jar more closely.
gameserver.developer.packet.attackstatus.skill.skin = false

# ------------------------------
# Phase26 Stat Cap / Buff Overflow Probe
# ------------------------------
# Logs whenever a stat is clamped by StatCapUtil. Useful for 32767-like cap bugs.
gameserver.developer.stat.cap.trace.enable = true
gameserver.developer.stat.cap.trace.console = true
