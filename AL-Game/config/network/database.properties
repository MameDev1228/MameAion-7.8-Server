# ==========================================
# 		  DATABASE CONFIGURATIONS
# ==========================================

# This class represents database driver class that will be used while connecting to database
database.driver = com.mysql.cj.jdbc.Driver

# This is database url.
database.url = jdbc:mysql://162.43.72.22:3306/aion75_game?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true&tcpKeepAlive=true&connectTimeout=10000&socketTimeout=600000

# Database user
database.user = mameaion

# Database password
# NOTE: Change this! Root password is not safe!
database.password = Mayu10201020+

# Number of partitions created by bonecp
database.bonecp.partition.count = 2

# Minimal amount of connections kept in bonecp partition
database.bonecp.partition.connections.min = 2

# Maximal amount of connections kept in bonecp partition
database.bonecp.partition.connections.max = 5


# BoneCP / MySQL8 stability settings
# The DB server/network can reset idle TCP connections after ~6 minutes.
# Validate and recycle idle physical connections before that happens.
database.bonecp.idle.connection.test.period.seconds = 60
database.bonecp.idle.max.age.seconds = 180
database.bonecp.max.connection.age.seconds = 300
database.bonecp.connection.timeout.ms = 10000
database.bonecp.connection.test.statement = SELECT 1
database.bonecp.acquire.retry.attempts = 5
database.bonecp.acquire.retry.delay.ms = 1000

# Script context that will be loaded by database factory, it should implement DAO instances
database.scriptcontext.descriptor = ./data/scripts/system/database.xml